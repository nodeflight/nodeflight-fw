# Setup debug output

per uart_st uart3 pin_d08 pin_none dma_1_4 dma_none
mod - stdout uart_st

# Setup SD card

# cs = d02
# sck = c10
# mosi = c12
# miso = c11

per sdcard_cs gpio_d02 pin_d02
per sdcard_spi spi3 pin_c10 pin_c12 pin_c11 dma_none dma_none

mod ext sdcard sdcard_spi sdcard_cs

inc /ext/boot.cfg

